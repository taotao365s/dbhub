name: Run Tests

on:
  pull_request:
    branches: [ main ]
    # Run when PR is opened, synchronized, or reopened
    types: [opened, synchronize, reopened]
  # Also allow manual triggering
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests
        run: pnpm test:unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Verify Docker is available
        run: |
          docker --version
          docker info

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Run integration tests
        run: pnpm test:integration

  dm-regression:
    name: DM8 real-instance regression
    # Opt in only on a trusted runner with licensed official images preloaded.
    # Never execute fork PR code on a self-hosted runner.
    if: >-
      vars.DM_REGRESSION_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: unit-tests
    runs-on: [self-hosted, dm8]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image:
          - dm8_single:dm8_20241022_rev244896_x86_rh6_64
          - dm8:dm8_20250924_rev288894_HWarm_kylin10_64
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
        with:
          version: 10.17.1
      - uses: actions/setup-node@v3
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:backend
      - name: Verify modes, TLS, SSH, privileges, pool and built MCP
        env:
          DM_DOCKER_IMAGE: ${{ matrix.image }}
          DM_TEST_BUILT: '1'
          NODE_OPTIONS: --openssl-legacy-provider
        run: pnpm exec tsx scripts/test-dm-regression.ts
